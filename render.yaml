services:
  - type: web
    name: skillswap
    runtime: node
    plan: starter
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build:frontend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    disk:
      name: skillswap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/skillswap.db
